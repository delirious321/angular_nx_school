<lib-horna-lista></lib-horna-lista>

<div class="px-6 pt-4">
  <p-breadcrumb [model]="breadcrumb" [home]="home" />
</div>

<div>
  <div class="max-w-4xl mx-auto p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

        
            <div class="bg-gray-50 rounded-2xl h-80 flex items-center justify-center">
              <i class="pi pi-image text-gray-100 text-4xl"></i>
            </div>

        
            <div class="flex flex-col gap-4">


                <span class="text- text-gray-100 uppercase tracking-wider">{{ produkt.oddiel_produktu }}</span>
                <h1 class="text-4xl font-bold text-gray-100">{{ produkt.meno_produktu }}</h1>


                <div class="flex items-center gap-2">
                  <p-rating [ngModel]="hodnotenieCislo" [readonly]="true" [stars]="5" />
                  <span class="text-sm text-gray-400">{{ produkt.hodnotenie }}</span>
                </div>


                <p class="text-gray-500 leading-relaxed">{{ produkt.popis }}</p>
                <span class="text-3xl font-bold text-gray-100">€{{ produkt.cena }}</span>
                <p-tag [value]="produkt.na_sklade ? 'Na sklade' : 'Nie je na sklade'" [severity]="produkt.na_sklade ? 'success' : 'danger'" />
                <p-button label="Do košíka" icon="pi pi-shopping-cart" [disabled]="!produkt.na_sklade" />
              

          </div>

      </div>
  </div>
</div>
